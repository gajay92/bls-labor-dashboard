# .github/workflows/update_data.yml
#
# GitHub Action: Monthly BLS Data Update
# ---------------------------------------
# Runs automatically on the 5th of every month at 9:00 AM UTC.
# (BLS typically releases the jobs report in the first week of each month.)
# Also can be triggered manually from the GitHub Actions tab.
#
# What it does:
#   1. Checks out the repository
#   2. Installs Python dependencies
#   3. Runs collect_data.py to fetch the latest BLS data
#   4. Commits and pushes the updated CSV back to the repo
#   5. Streamlit Community Cloud auto-redeploys when it detects the new commit

name: Monthly BLS Data Update

on:
  # Run on the 5th of every month at 9:00 AM UTC
  schedule:
    - cron: "0 9 5 * *"

  # Allow manual trigger from the GitHub Actions tab (useful for testing)
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install required Python packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run the data collection script
      - name: Collect latest BLS data
        run: python collect_data.py

      # Step 5: Commit and push the updated CSV back to the repo
      - name: Commit and push updated data
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bls_data.csv
          # Only commit if there are actual changes to the data file
          git diff --cached --quiet || git commit -m "chore: update BLS data $(date +'%Y-%m')"
          git push
